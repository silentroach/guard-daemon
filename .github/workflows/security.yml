name: Безопасность

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24.18.1"
  NPM_VERSION: "11.16.0"
  GOVULNCHECK_VERSION: "v1.1.4"
  GITLEAKS_VERSION: "v8.30.1"
  FOUNDRY_VERSION: "v1.7.1"
  FOUNDRY_SHA256: "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b"
  PYTHON_VERSION: "3.14.6"
  SOLC_COMMIT: "8a079791"
  SOLC_SHA256: "c8d35afdddc3cd2743ee88b8f25e0fecd16e2bdd5f2120f37e52cd9cc45ae0e6"
  SOLC_VERSION: "0.8.36"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    name: Уязвимости
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Установить npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Установить Node.js-зависимости
        run: npm ci
      - name: Установить govulncheck
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Проверить Go-зависимости
        run: make vuln
      - name: Проверить Node.js-зависимости
        run: make audit

  secrets:
    name: Секреты
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить полную историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Установить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Установить gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Проверить рабочее дерево и историю
        run: make secret-scan

  solidity-static:
    name: Статический анализ Solidity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Foundry
        run: bash scripts/install-foundry-ci.sh
      - name: Установить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Установить Slither и solc
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes \
            --requirement tools/slither-requirements.txt
          bash scripts/install-solc-ci.sh
      - name: Проверить Solidity
        run: make contracts-static
