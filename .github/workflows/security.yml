name: Безопасность

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    name: Уязвимости
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Восстановить кеш зависимостей
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.npm
          key: security-${{ runner.os }}-${{ hashFiles('go.sum', 'package-lock.json') }}
          restore-keys: security-${{ runner.os }}-
      - name: Установить Node.js-зависимости
        run: nix develop --command npm ci
      - name: Проверить Go-зависимости
        run: nix develop --command make vuln
      - name: Проверить Node.js-зависимости
        run: nix develop --command make audit

  secrets:
    name: Секреты
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить полную историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Установить Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Проверить рабочее дерево и историю
        run: nix develop --command make secret-scan
