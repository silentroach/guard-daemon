name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24.18.1"
  NPM_VERSION: "11.16.0"
  GOVULNCHECK_VERSION: "v1.1.4"
  GITLEAKS_VERSION: "v8.30.1"
  FOUNDRY_VERSION: "v1.7.1"
  FOUNDRY_SHA256: "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b"
  PYTHON_VERSION: "3.14.6"
  SOLC_COMMIT: "8a079791"
  SOLC_SHA256: "c8d35afdddc3cd2743ee88b8f25e0fecd16e2bdd5f2120f37e52cd9cc45ae0e6"
  SOLC_VERSION: "0.8.36"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Install Node.js dependencies
        run: npm ci
      - name: Install govulncheck
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Check Go dependencies
        run: make vuln
      - name: Check Node.js dependencies
        run: make audit

  dependency-review:
    name: New Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Review vulnerabilities and licenses
        id: dependency-review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause,
            BlueOak-1.0.0, CC0-1.0, ISC, MIT, MIT-0,
            Python-2.0, Unicode-3.0, Unlicense, Zlib
          comment-summary-in-pr: never
          fail-on-scopes: runtime, development, unknown
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          warn-only: false
      - name: Reject missing and unknown licenses
        env:
          DEPENDENCY_CHANGES: ${{ steps.dependency-review.outputs.dependency-changes }}
        run: python test/ci/dependency_licenses.py

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Install gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Scan working tree and history
        run: make secret-scan

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install policy-check dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --requirement test/ci/requirements.txt
      - name: Run policy negative tests
        run: python -B -m unittest discover -s test/ci -p 'test_*.py'
      - name: Check repository policy
        run: bash test/ci/repository-policy.sh
      - name: Statically verify systemd configuration
        run: |
          set -euo pipefail
          sudo systemd-sysusers packaging/systemd/guard-daemon.sysusers
          sudo /usr/bin/env -i PATH=/usr/bin:/bin /bin/bash --noprofile --norc scripts/verify-systemd-account.sh
          sudo systemd-tmpfiles --create packaging/systemd/guard-daemon.tmpfiles
          sudo install -d -o root -g root -m 0755 /usr/lib/guard-daemon/releases/ci-placeholder/artifacts/contracts
          sudo install -o root -g root -m 0755 /bin/true /usr/lib/guard-daemon/releases/ci-placeholder/guard-daemon
          sudo install -o root -g root -m 0644 /dev/null /usr/lib/guard-daemon/releases/ci-placeholder/artifacts/contracts/RescuerV2.json
          sudo ln -s releases/ci-placeholder /usr/lib/guard-daemon/current
          sudo install -o root -g root -m 0644 packaging/systemd/guard-daemon.state.env /usr/lib/guard-daemon/guard-daemon.state.env
          systemd-analyze verify packaging/systemd/guard-daemon.service

  reproducible-artifacts:
    name: Reproducible Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Compare two clean builds
        run: make reproducibility-check

  solidity-static:
    name: Solidity Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Foundry
        run: bash scripts/install-foundry-ci.sh
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Slither and solc
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes \
            --requirement tools/slither-requirements.txt
          bash scripts/install-solc-ci.sh
      - name: Check Solidity
        run: make contracts-static
