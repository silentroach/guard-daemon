name: Безопасность

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24.18.1"
  NPM_VERSION: "11.16.0"
  GOVULNCHECK_VERSION: "v1.1.4"
  GITLEAKS_VERSION: "v8.30.1"
  FOUNDRY_VERSION: "v1.7.1"
  FOUNDRY_SHA256: "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b"
  PYTHON_VERSION: "3.14.6"
  SOLC_COMMIT: "8a079791"
  SOLC_SHA256: "c8d35afdddc3cd2743ee88b8f25e0fecd16e2bdd5f2120f37e52cd9cc45ae0e6"
  SOLC_VERSION: "0.8.36"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilities:
    name: Уязвимости
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Установить npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Установить Node.js-зависимости
        run: npm ci
      - name: Установить govulncheck
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Проверить Go-зависимости
        run: make vuln
      - name: Проверить Node.js-зависимости
        run: make audit

  dependency-review:
    name: Проверка новых зависимостей
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Проверить уязвимости и лицензии
        id: dependency-review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause,
            BlueOak-1.0.0, CC0-1.0, ISC, MIT, MIT-0,
            Python-2.0, Unicode-3.0, Unlicense, Zlib
          comment-summary-in-pr: never
          fail-on-scopes: runtime, development, unknown
          fail-on-severity: high
          license-check: true
          vulnerability-check: true
          warn-only: false
      - name: Заблокировать отсутствующие и неизвестные лицензии
        env:
          DEPENDENCY_CHANGES: ${{ steps.dependency-review.outputs.dependency-changes }}
        run: python test/ci/dependency_licenses.py

  secrets:
    name: Секреты
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить полную историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Установить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Установить gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Проверить рабочее дерево и историю
        run: make secret-scan

  repository-policy:
    name: Политика репозитория
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    steps:
      - name: Получить полную историю
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Установить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Установить зависимости проверки политики
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --requirement test/ci/requirements.txt
      - name: Проверить негативные примеры политики
        run: python -B -m unittest discover -s test/ci -p 'test_*.py'
      - name: Проверить политику репозитория
        run: bash test/ci/repository-policy.sh
      - name: Статически проверить unit systemd
        run: |
          set -euo pipefail
          sudo systemd-sysusers --dry-run packaging/systemd/guard-daemon.sysusers
          id -u guard-daemon >/dev/null 2>&1 || sudo useradd --system --home-dir /var/lib/guard-daemon --shell /usr/sbin/nologin guard-daemon
          sudo install -d -o root -g root -m 0755 /usr/lib/guard-daemon/releases/ci-placeholder/artifacts/contracts
          sudo install -o root -g root -m 0755 /bin/true /usr/lib/guard-daemon/releases/ci-placeholder/guard-daemon
          sudo install -o root -g root -m 0644 /dev/null /usr/lib/guard-daemon/releases/ci-placeholder/artifacts/contracts/RescuerV2.json
          sudo ln -s releases/ci-placeholder /usr/lib/guard-daemon/current
          sudo install -o root -g root -m 0644 packaging/systemd/guard-daemon.state.env /usr/lib/guard-daemon/guard-daemon.state.env
          sudo install -d -o root -g guard-daemon -m 0750 /etc/guard-daemon
          sudo install -o root -g guard-daemon -m 0640 /dev/null /etc/guard-daemon/guard-daemon.env
          sudo install -d -o guard-daemon -g guard-daemon -m 0700 /var/lib/guard-daemon /var/tmp/guard-daemon-leases-v1
          sudo install -d -o root -g root -m 0755 /var/lib/guard-daemon-operator
          sudo install -d -o root -g root -m 0700 /var/lib/guard-daemon-operator/deployment-recovery
          sudo install -d -o root -g root -m 0700 /var/lib/guard-daemon-operator/deployment-manifests
          systemd-analyze verify packaging/systemd/guard-daemon.service

  reproducible-artifacts:
    name: Воспроизводимые артефакты
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Установить npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Установить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Установить gitleaks
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Сравнить две чистые сборки
        run: bash test/ci/compare-artifacts.sh

  solidity-static:
    name: Статический анализ Solidity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Foundry
        run: bash scripts/install-foundry-ci.sh
      - name: Установить Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Установить Slither и solc
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes \
            --requirement tools/slither-requirements.txt
          bash scripts/install-solc-ci.sh
      - name: Проверить Solidity
        run: make contracts-static
