name: Проверки

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24.18.1"
  NPM_VERSION: "11.16.0"
  ACTIONLINT_VERSION: "v1.7.12"
  FOUNDRY_VERSION: "v1.7.1"
  FOUNDRY_SHA256: "cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Форматирование
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Установить npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Установить Node.js-зависимости
        run: npm ci
      - name: Установить Foundry
        run: bash scripts/install-foundry-ci.sh
      - name: Установить actionlint
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Установить ShellCheck
        run: |
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          install "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${RUNNER_TEMP}/bin/shellcheck"
      - name: Проверить форматирование
        run: make format-check

  go:
    name: Проверки Go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Собрать и проверить Go
        run: make go-ci

  typescript-contracts:
    name: Проверки TypeScript и контрактов
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Установить npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Установить Node.js-зависимости
        run: npm ci
      - name: Установить Foundry
        run: bash scripts/install-foundry-ci.sh
      - name: Проверить TypeScript и контракты
        run: make typecheck lint contracts-build contracts-test contracts-lint artifacts-verify

  adversarial-go:
    name: Атакующая интеграция Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Проверить явный набор атакующих пакетов
        run: bash test/ci/adversarial-go.sh

  go-fuzz:
    name: Ограниченный фаззинг Go
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Выполнить ограниченные фаззинг-кампании
        run: bash test/ci/go-fuzz.sh

  local-chain:
    name: Изолированные тесты локального развёртывания
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Установить npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Установить Node.js-зависимости
        run: npm ci
      - name: Установить Foundry
        run: bash scripts/install-foundry-ci.sh
      - name: Проверить развёртывание только на локальной цепочке
        run: bash test/ci/run-deployment-tests.sh
