[profile.default]
src = "contracts"
test = "test/contracts"
out = "out"
cache_path = "cache"
solc = "0.8.36"
auto_detect_solc = false
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
use_literal_content = true
fuzz = { runs = 1024, seed = "0x03" }
invariant = { runs = 256, depth = 128, fail_on_revert = true }

[profile.ci]
fuzz = { runs = 10000, seed = "0x03" }
invariant = { runs = 1000, depth = 256, fail_on_revert = true }
